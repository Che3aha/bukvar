function nav(name){if('speechSynthesis'in window)speechSynthesis.cancel();document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.nav===name));if(name==='home')home();if(name==='letters')letterMap();if(name==='stories')stories();if(name==='art')artMenu();if(name==='progress')progress();if(name==='parent')parent();window.scrollTo(0,0)}
function home(){app.innerHTML='<section class="hero"><div><div class="eyebrow">ДОБРО ДОШАО, МАЛИ ИСТРАЖИВАЧУ</div><h1>Велико путовање<br>кроз мала слова.</h1><p>Откриј слова, сложи речи и оживи приче. Свака мала победа доноси звездицу!</p><button class="primary" id="start">Хајде да се играмо →</button></div>'+owlScene()+'</section><div class="sectionhead"><h2>Шта данас истражујемо?</h2><span class="muted">Твој темпо. Твоја авантура.</span></div><div class="cards"><button class="card" data-nav="letters"><span class="icon">Аа</span><span class="go">↗</span><h3>Слова и речи</h3><p>30 слова • слике, слагалице и писање</p></button><button class="card" data-nav="stories"><span class="icon">'+svg('rabbit')+'</span><span class="go">↗</span><h3>Мале приче</h3><p>Читај, размисли и откриј шта се десило.</p></button><button class="card" data-nav="art"><span class="icon">✎</span><span class="go">↗</span><h3>Цртам и бојим</h3><p>Твоје боје. Твоја машта. Твоја слика.</p></button></div><div class="sectionhead"><h2>Твоје прво слово</h2><span class="muted">Почни од А, И и М — као у буквару.</span></div>'+letterButtons(letters.slice(0,10));$('#start').onclick=()=>lesson(0);bindLetters()}
function letterButtons(arr){return '<div class="gridletters">'+arr.map(l=>{let i=letters.indexOf(l),n=state.earned.filter(x=>x.startsWith('l'+i+'-')).length;return '<button class="letter '+(n>=5?'done':'')+'" data-letter="'+i+'" aria-label="Слово '+l[0]+', '+l[1]+'">'+l[0]+'<small>'+n+'/5</small></button>'}).join('')+'</div>'}
function bindLetters(){document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>lesson(+b.dataset.letter))}
function letterMap(){app.innerHTML='<div class="sectionhead"><h2>Путовање кроз буквар</h2><span class="muted">Редослед увођења слова из књиге</span></div><p class="instructions">Изабери било које слово. У свакој станици те чека пет малих задатака.</p>'+letterButtons(letters)+'<p class="source">Штампана слова: стр. 18–66 приложеног буквара. За игру су направљене нове илустрације и нови задаци.</p>';bindLetters()}
const modes=[['learn','1. Откриј'],['initial','2. Прво слово'],['case','3. Велико и мало'],['build','4. Сложи реч'],['trace','5. Пиши']];
function lesson(i,m='learn'){current=i;mode=m;locked=false;round=0;let l=letters[i];app.innerHTML='<div class="sectionhead"><button class="small" id="back">← Сва слова</button><span class="muted">Станица '+(i+1)+' / 30 · '+l[1]+'</span><div><button class="small" id="prev" aria-label="Претходно слово">←</button> <button class="small" id="nextletter" aria-label="Следеће слово">→</button></div></div><div class="tabs">'+modes.map(x=>'<button class="tab '+(m===x[0]?'active':'')+'" data-mode="'+x[0]+'">'+x[1]+(state.earned.includes('l'+i+'-'+x[0])?' ✓':'')+'</button>').join('')+'</div><section class="workspace" id="work"></section><p class="source">Основа: '+l[0]+' — '+l[1]+', стр. '+l[3]+' буквара. Вежбе користе штампану ћирилицу.</p>';$('#back').onclick=()=>nav('letters');$('#prev').onclick=()=>lesson((i+29)%30);$('#nextletter').onclick=()=>lesson((i+1)%30);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>lesson(i,b.dataset.mode));renderExercise()}
function feedback(t){let f=$('#feedback');if(f)f.textContent=t;$('#live').textContent=t}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function options(correct,pool){return shuffle([correct,...shuffle(pool.filter(x=>x!==correct)).slice(0,2)])}
function renderExercise(){let l=letters[current],w=$('#work');locked=false;let lower=l[0].toLowerCase(), end='<div class="feedback" id="feedback" role="status"></div>';
if(mode==='learn'){w.innerHTML='<div class="lesson-layout"><div><div class="eyebrow">УПОЗНАЈ НОВОГ ДРУГАРА</div><div class="bigletter">'+l[0]+lower+'</div><h2>'+l[1].toUpperCase()+'</h2><button class="small" id="listen">♫ Послушај реч</button></div><div>'+svg(l[2])+'<p>Пронађи слово <strong>'+l[0]+'</strong>.</p></div></div><div class="choices">'+options(l[0],alphabet).map(v=>'<button class="choice" data-answer="'+v+'">'+v+'</button>').join('')+'</div>'+end;$('#listen').onclick=()=>say(l[1]);answers(l[0]);}
if(mode==='initial'){w.innerHTML='<h2>Којим словом почиње ова реч?</h2>'+svg(l[2])+'<h3>'+l[1].toUpperCase()+'</h3><div class="choices">'+options(l[0],alphabet).map(v=>'<button class="choice" data-answer="'+v+'">'+v+'</button>').join('')+'</div>'+end;answers(l[0])}
if(mode==='case'){w.innerHTML='<h2>Пронађи мало слово.</h2><div class="bigletter">'+l[0]+'</div><p>Које мало слово је пар овом великом слову?</p><div class="choices">'+options(lower,alphabet.map(x=>x.toLowerCase())).map(v=>'<button class="choice" data-answer="'+v+'">'+v+'</button>').join('')+'</div>'+end;answers(lower)}
if(mode==='build'){let chars=l[1].toUpperCase().split(''),picked=[];w.innerHTML='<h2>Сложи реч од слова.</h2>'+svg(l[2])+'<p>Модел: <strong>'+l[1].toUpperCase()+'</strong></p><div class="slots" id="slots">'+chars.map(()=>'·').join('')+'</div><div class="tiles">'+shuffle(chars.map((c,i)=>({c,i}))).map(x=>'<button class="tile" data-tile="'+x.i+'">'+x.c+'</button>').join('')+'</div><div class="controls"><button class="secondary" id="undo">← Врати слово</button> <button class="primary" id="check">Провери</button></div>'+end;let update=()=>{$('#slots').textContent=picked.map(x=>chars[x]).join('')+'·'.repeat(chars.length-picked.length)};document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{if(locked)return;picked.push(+b.dataset.tile);b.disabled=true;update()});$('#undo').onclick=()=>{if(locked)return;let n=picked.pop();if(n!==undefined)$('[data-tile="'+n+'"]').disabled=false;update();feedback('')};$('#check').onclick=()=>{if(locked)return;if(picked.map(x=>chars[x]).join('')===l[1].toUpperCase())success();else feedback('Погледај модел и покушај поново. Можеш да вратиш слово.')}}
if(mode==='trace'){w.innerHTML='<h2>Прати слово '+l[0]+' прстом или мишем.</h2><p>Цртај преко бледог слова. Одрасли може да ти покаже покрете.</p><div class="canvaswrap"><canvas id="drawing" width="900" height="330" aria-label="Површина за вежбање слова"></canvas></div><div class="controls"><button class="secondary" id="clear">Обриши</button> <button class="primary" id="finished">Заврши вежбу</button> <button class="small" onclick="window.print()">Штампај</button></div><p class="muted">Ово је слободна вежба писања. Апликација не оцењује облик слова.</p>'+end;let d=setupCanvas(l[0]+' '+lower);$('#clear').onclick=()=>d.reset();$('#finished').onclick=()=>{if(!d.hasDrawn())feedback('Најпре испробај писање на површини.');else if(!locked)success('Лепо си вежбао! Покажи слово одраслом.')}}}
function answers(correct){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;if(b.dataset.answer===correct){b.classList.add('good');success()}else{b.classList.add('bad');b.disabled=true;feedback('Добар покушај! Погледај још једном.')}})}
function success(text='Браво! Освојио си звездицу.'){locked=true;let id='l'+current+'-'+mode;let old=state.earned.includes(id);award(id);feedback(old?'Браво! Поновио си ову вежбу.':text);let b=document.createElement('button');b.className='primary';b.textContent=mode==='trace'?'Следеће слово →':'Следећи задатак →';b.onclick=()=>{let n=modes.findIndex(x=>x[0]===mode);lesson(mode==='trace'?(current+1)%30:current,mode==='trace'?'learn':modes[n+1][0])};$('#work').append(b)}
function setupCanvas(text=''){let c=$('#drawing'),ctx=c.getContext('2d'),down=false,drawn=false;function reset(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fffdf5';ctx.fillRect(0,0,c.width,c.height);if(text){ctx.strokeStyle='#dce3d5';ctx.lineWidth=2;[75,255].forEach(y=>{ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(870,y);ctx.stroke()});ctx.font='bold 240px Arial';ctx.textAlign='center';ctx.fillStyle='#d9dfd1';ctx.fillText(text,450,252)}drawn=false}reset();function pos(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);let [x,y]=pos(e);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=ink;ctx.fill();ctx.beginPath();ctx.moveTo(x,y);drawn=true};c.onpointermove=e=>{if(!down)return;ctx.lineWidth=9;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ink;ctx.lineTo(...pos(e));ctx.stroke()};c.onpointerup=c.onpointercancel=()=>down=false;return{reset,hasDrawn:()=>drawn}}
const storyData=[{name:'Деда и репа',ref:'стр. 24–25',kind:'tree',text:'Деда вуче репу, али репа остаје у земљи. Бака долази да помогне. Стижу дете и мала животиња. Сви заједно извуку репу!',q:'Како су извукли репу?',a:['Заједно су помогли.','Репа је одлетела.','Нико није помогао.'],correct:0,talk:'Када си ти некоме помогао?'},{name:'На излету',ref:'стр. 30–31',kind:'rabbit',text:'Медвед, мачка и зец иду на излет. У торби носе колаче. На ливади седну да се одморе и играју се преношења поруке.',q:'Шта су понели у торби?',a:['Колаче.','Ципеле.','Кишобран.'],correct:0,talk:'Шта би ти понео на излет? Смисли смешну поруку.'},{name:'Кишобран',ref:'стр. 36',kind:'flower',text:'Почиње киша. Девојчица отвори кишобран. На стази угледа мале мраве. Она их склони од кише и насмеши се.',q:'Зашто је отворила кишобран?',a:['Падала је киша.','Падао је снег.','Да направи торту.'],correct:0,talk:'Нацртај како би ти помогао малој животињи.'},{name:'Паткино писмо',ref:'стр. 40',kind:'fish',text:'Патка плива преко реке. На глави пажљиво носи писмо. У писму је лепа порука за њеног друга.',q:'Где се налази писмо?',a:['На глави патке.','Под каменом.','На дрвету.'],correct:0,talk:'Коме би ти послао лепу поруку?'},{name:'Маме и бебе',ref:'стр. 53',kind:'cat',text:'Мачка има маче. Пас има штене. Крава има теле. Бебе расту, играју се и уче уз своје маме.',q:'Како се зове беба мачке?',a:['Маче.','Теле.','Штене.'],correct:0,talk:'Које још животињске породице познајеш?'}];
function stories(){app.innerHTML='<div class="sectionhead"><h2>Мале приче, велике идеје</h2></div><p>Нове кратке приче инспирисане темама буквара. Читај са одраслим.</p><div class="cards">'+storyData.map((s,i)=>'<button class="card" data-story="'+i+'">'+svg(s.kind)+'<h3>'+s.name+'</h3><p>Прочитај • одговори • испричај</p></button>').join('')+'</div>';document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>story(+b.dataset.story))}
function story(i){let s=storyData[i];locked=false;app.innerHTML='<div class="sectionhead"><button class="small" id="back">← Приче</button><h2>'+s.name+'</h2></div><div class="workspace"><div class="storyscene">'+svg(s.kind)+'</div><div class="storytext">'+s.text+'</div><button class="small" id="listen">♫ Прочитај</button><h2>'+s.q+'</h2><div class="choices">'+shuffle(s.a.map((t,j)=>({t,j}))).map(x=>'<button class="choice word" data-story-answer="'+x.j+'">'+x.t+'</button>').join('')+'</div><div class="feedback" id="feedback" role="status"></div><p class="instructions"><strong>Сада ти причај:</strong> '+s.talk+'</p><button class="secondary" id="drawstory">Нацртај своју причу</button></div><p class="source">Нова поједностављена адаптација теме из буквара, '+s.ref+'.</p>';$('#back').onclick=()=>nav('stories');$('#listen').onclick=()=>say(s.text);$('#drawstory').onclick=()=>draw('Моја прича');document.querySelectorAll('[data-story-answer]').forEach(b=>b.onclick=()=>{if(locked)return;if(+b.dataset.storyAnswer===s.correct){locked=true;b.classList.add('good');let old=state.earned.includes('story'+i);award('story'+i);feedback(old?'Тачно! Лепо си поновио причу.':'Тачно! Нова звездица за тебе.')}else{b.classList.add('bad');b.disabled=true;feedback('Прочитај причу још једном. Покушај поново.')}})}
const colors=['#eb7970','#edc765','#8fba79','#7baec9','#ac91cc','#eeb38e','#ffffff','#465447'];
function palette(){return '<div class="colors">'+colors.map((c,i)=>'<button class="swatch '+(i===colorIndex?'selected':'')+'" style="background:'+c+'" data-color="'+i+'" aria-label="'+['Црвена','Жута','Зелена','Плава','Љубичаста','Наранџаста','Бела','Тамна'][i]+'"></button>').join('')+'</div>'}
function bindColors(){document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{colorIndex=+b.dataset.color;ink=colors[colorIndex];document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x===b))})}
function artMenu(){let arts=[['cat','Шарена мачка'],['plane','Мој авион'],['flower','Љубичица'],['fish','Риба'],['frog','Жаба'],['rabbit','Зец']];app.innerHTML='<div class="sectionhead"><h2>Мала уметничка радионица</h2></div><p>Изабери боју, па кликни део слике. Или нацртај нешто сасвим своје!</p><div class="cards">'+arts.map(x=>'<button class="card" data-art="'+x[0]+'">'+svg(x[0])+'<h3>'+x[1]+'</h3><p>Кликни и обој →</p></button>').join('')+'</div><p><button class="primary" id="freedraw">✎ Нацртај своју породицу</button></p><p class="source">Бојење и цртање инспирисани задацима на стр. 18–21, 36, 51 и 69.</p>';document.querySelectorAll('[data-art]').forEach(b=>b.onclick=()=>coloring(b.dataset.art));$('#freedraw').onclick=()=>draw('Моја породица')}
function coloring(kind){artKind=kind;app.innerHTML='<div class="sectionhead"><button class="small" id="back">← Радионица</button><h2>Оживи слику бојама</h2></div><div class="workspace"><p>Изабери боју. Кликни део слике који желиш да обојиш.</p>'+palette()+svg(kind,true)+'<div class="controls"><button class="secondary" id="resetart">Почни поново</button> <button class="primary" id="saveart">Сачувај слику</button> <button class="small" onclick="window.print()">Штампај</button></div><div class="feedback" id="feedback" role="status"></div></div>';$('#back').onclick=()=>nav('art');bindColors();let regions=[...document.querySelectorAll('[data-paint]')];if(state.art[kind])regions.forEach((el,i)=>{if(state.art[kind][i])el.setAttribute('fill',state.art[kind][i])});regions.forEach(el=>el.onclick=()=>{el.setAttribute('fill',ink);state.art[kind]=regions.map(x=>x.getAttribute('fill'));save()});$('#resetart').onclick=()=>{delete state.art[kind];save();coloring(kind)};$('#saveart').onclick=()=>{download(new Blob([$('.colorart').outerHTML],{type:'image/svg+xml'}),'moja-slika.svg');feedback('Слика је спремна за преузимање.')}}
function draw(title){app.innerHTML='<div class="sectionhead"><button class="small" id="back">← Радионица</button><h2>'+title+'</h2></div><div class="workspace"><p>Цртај мишем или прстом. Испричај шта си нацртао.</p>'+palette()+'<div class="canvaswrap"><canvas id="drawing" width="900" height="540" aria-label="Површина за слободно цртање"></canvas></div><div class="controls"><button class="secondary" id="clear">Обриши</button> <button class="primary" id="saveart">Сачувај цртеж</button> <button class="small" onclick="window.print()">Штампај</button></div><div class="feedback" id="feedback" role="status"></div><p class="muted">Сачувај цртеж пре него што напустиш ову страницу.</p></div>';let d=setupCanvas();bindColors();$('#back').onclick=()=>nav('art');$('#clear').onclick=d.reset;$('#saveart').onclick=()=>$('#drawing').toBlob(blob=>{download(blob,'moj-crtez.png');feedback('Цртеж је спреман за преузимање.')})}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function progress(){let n=state.earned.length,done=letters.filter((l,i)=>state.earned.filter(x=>x.startsWith('l'+i+'-')).length===5).length;app.innerHTML='<div class="sectionhead"><h2>Моје мале победе</h2></div><div class="hero"><div><div class="eyebrow">СВАКА ВЕЖБА ЈЕ КОРАК НАПРЕД</div><h1>'+n+' звездица!</h1><p>Завршио си свих пет вежби за '+done+' слова. Вежбе можеш да поновиш кад год пожелиш.</p><div class="meter"><span style="width:'+n/155*100+'%"></span></div><p>'+n+' / 155 јединствених задатака</p></div>'+owlScene()+'</div><div class="sectionhead"><h2>Моје значке</h2></div><div class="badgegrid">'+[[1,'✿','Први корак'],[10,'☆','Истраживач'],[30,'♧','Мудра совица'],[75,'✦','Звездани путник'],[155,'★','Мајстор буквара']].map(([count,icon,name])=>'<div class="badge" style="opacity:'+(n>=count?1:.45)+'"><div style="font-size:40px">'+icon+'</div><strong>'+name+'</strong><p>'+ (n>=count?'Освојено!':count+' звездица')+'</p></div>').join('')+'</div><p class="muted">Напредак се чува на овом уређају у овом прегледачу.</p>'}
function parent(){app.innerHTML='<div class="sectionhead"><h2>За родитеље и наставнике</h2></div><div class="workspace" style="text-align:left"><h3>Мали кораци, без журбе</h3><p class="instructions">За узраст 3–4 године: бирајте слике, бојење и кратко слушање уз одраслог. За 5–6 година и прваке: додајте прво слово, парове великих и малих слова, слагање речи и писање. Узраст је смерница — пратите дететову спремност.</p><h3>Шта је преузето као основа?</h3><p class="instructions">Апликација прати редослед штампаних слова и речи са стр. 18–66 приложеног буквара. Садржи 150 задатака за слова, пет кратких прича са питањима, шест слика за бојење и слободно цртање. Илустрације су нове. Приче су кратке адаптације тема; апликација није потпуна дигитална верзија свих 160 страна и не обрађује писана слова.</p><h3>Рад без интернета</h3><p class="instructions">Сачувајте HTML датотеку на рачунар и отворите је у Chrome или Edge прегледачу. Игре, илустрације и звучни сигнали раде без интернета. Читање наглас захтева инсталиран српски системски глас и може зависити од система. Ако није доступан, одрасли чита текст. Нема пријављивања, огласа или слања података.</p><h3>Напредак и цртежи</h3><p class="instructions">Звездице и бојење се чувају у овом прегледачу ако је локално чување дозвољено. Слободне цртеже преузмите као PNG. Брисање података прегледача може обрисати напредак. Исто успешно решено питање не доноси нову звездицу. Писање је слободна вежба без аутоматске процене.</p><p id="storagestatus">'+(storageOK?'Локално чување је доступно.':'Локално чување није доступно — напредак ће трајати само током ове сесије.')+'</p><button class="secondary" id="export">Преузми напредак</button> <button class="small" id="resetprogress">Обриши напредак…</button><div class="feedback" id="feedback"></div><p class="source">Садржај заснован на приложеној датотеци 01-bukvar.pdf. Наслов у извору: „Буквар за први разред основне школе“. Примери речи и теме су образовна основа; нове активности не замењују рад са књигом и наставником.</p></div>';$('#export').onclick=()=>download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'bukvar-napredak.json');$('#resetprogress').onclick=()=>{if(confirm('Обрисати све звездице и сачуване боје на овом уређају?')){state.earned=[];state.art={};save();feedback('Напредак је обрисан.')}}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-nav]');if(b)nav(b.dataset.nav)});$('#sound').onclick=()=>{state.sound=!state.sound;save()};$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('#live').textContent='Приказ преко целог екрана није доступан.'}};header();home();
